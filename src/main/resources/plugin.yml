name: EconomyPol
version: '${project.version}'
main: com.earthpol.economyPol.EconomyPol
api-version: '1.21'
folia-supported: true
loadbefore:
  - Towny
  - Quickshop-Hikari
softdepend:
  - Vault
commands:
  economypol:
    description: EconomyPol player and admin economy utilities
    usage: /economypol <balance|bal|balancetop|baltop|deposit|withdraw|claim|paymentdelivery|normalizewallet|admin>
    aliases: [ecopol]
  bal:
    description: Show your balance
    usage: /bal
  baltop:
    description: Show the cached top player balances
    usage: /baltop
  claim:
    description: Claim as much overflow money as fits in your inventory
    usage: /claim
permissions:
  economypol.admin:
    default: op
