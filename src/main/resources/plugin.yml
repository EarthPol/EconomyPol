name: EconomyPol
version: 0.1.0
main: com.earthpol.economyPol.EconomyPol
api-version: '1.21'
folia-supported: true
loadbefore:
  - Towny
  - Quickshop-Hikari
softdepend:
  - Vault
commands:
  economypol:
    description: EconomyPol player and admin economy utilities
    usage: /economypol <balance|deposit|withdraw|syncwallet|admin>
    aliases: [ecopol]
permissions:
  economypol.use:
    default: true
  economypol.admin:
    default: op
