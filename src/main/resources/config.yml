database:
  host: 127.0.0.1
  port: 3306
  name: economypol
  username: root
  password: changeme
  disable-plugin-on-failure: true

currency:
  singular-name: Gold Coin
  plural-name: Gold Coins
  denominations:
    - material: GOLD_NUGGET
      base-units: 1
    - material: GOLD_INGOT
      base-units: 9
    - material: GOLD_BLOCK
      base-units: 81

numeric:
  # How non-whole external amounts from Vault/VaultUnlocked are handled.
  # REJECT: fail on any fractional amount such as 5.5
  # TRUNCATE: cut toward zero; 5.9 -> 5, -5.9 -> -5
  decimal-handling: TRUNCATE

players:
  allow-self-deposit: false
  allow-external-credit: true
  allow-self-withdraw: true

routing:
  order:
    - INVENTORY
    - ENDER_CHEST
    - CUSTODIAL_ACCOUNT
  # What to do when a live-money spend must break a larger denomination and the
  # returned change does not fully fit in the configured physical destinations.
  # FAIL: cancel the transaction and restore the original physical money state.
  #       This is stricter and feels more physical, but can expose compatibility
  #       bugs in plugins that pre-check balance and then ignore failed withdraws.
  # CUSTODIAL: route the unplaceable part of the returned change into the
  #            player's custodial account instead of canceling the spend.
  #            This is more compatible with Towny/shops and avoids failures
  #            caused only by full storage, but some change becomes custodial
  #            money until the player explicitly withdraws it as physical cash.
  change-overflow-policy: CUSTODIAL

wallet:
  managed-ender-wallet-enabled: true
  include-live-player-inventory: true
  include-live-ender-chest: true

cache:
  # How long /economypol balancetop stays fresh before it is rebuilt on the next request.
  balancetop-ttl-seconds: 60

logging:
  debug: false
  audit-log-name: audit
  operations-log-name: operations
